<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Habit Tracker</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <meta name="theme-color" content="#f3f5f8" />
    <script>
      // Apply the saved light/dark choice before the page draws (same rules as src/lib/themeRules.js).
      try {
        var s = Object.assign({ mode: 'auto', darkFrom: '19:00', darkUntil: '07:00' }, JSON.parse(localStorage.getItem('habit-tracker-theme') || '{}'))
        var dark = s.mode === 'dark'
        if (s.mode !== 'light' && s.mode !== 'dark') {
          var m = function (x) { var p = x.split(':'); return p[0] * 60 + +p[1] }
          var now = new Date(), t = now.getHours() * 60 + now.getMinutes(), f = m(s.darkFrom), u = m(s.darkUntil)
          dark = f !== u && (f < u ? t >= f && t < u : t >= f || t < u)
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
